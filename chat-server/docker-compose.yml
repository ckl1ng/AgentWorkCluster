version: "3.8"

services:
  chat-server:
    build: .
    container_name: chat-server
    environment:
      - HOST=0.0.0.0
      - PORT=9010
      - DATA_DIR=/data
      - AGENT_SERVICE_SECRET=${AGENT_SERVICE_SECRET:?set AGENT_SERVICE_SECRET in your environment}
    volumes:
      - chat-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  agent-api:
    build: ../agent-service
    container_name: chat-agent-api
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=agent
      - PGUSER=agent
      - PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
      - CHAT_AUTH_INTROSPECTION_URL=http://chat-server:9010/internal/v1/auth/introspect
      - AGENT_SERVICE_SECRET=${AGENT_SERVICE_SECRET:?set AGENT_SERVICE_SECRET in your environment}
      - AGENT_MASTER_KEY=${AGENT_MASTER_KEY:?set AGENT_MASTER_KEY in your environment}
      - QQ_GATEWAY_INTERNAL_URL=http://qq-gateway:9013
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      chat-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9011/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  agent-worker:
    build: ../agent-service
    container_name: chat-agent-worker
    command: ["python", "-m", "app.worker"]
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=agent
      - PGUSER=agent
      - PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
      - CHAT_AUTH_INTROSPECTION_URL=http://chat-server:9010/internal/v1/auth/introspect
      - AGENT_SERVICE_SECRET=${AGENT_SERVICE_SECRET:?set AGENT_SERVICE_SECRET in your environment}
      - AGENT_MASTER_KEY=${AGENT_MASTER_KEY:?set AGENT_MASTER_KEY in your environment}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      agent-api:
        condition: service_healthy
    restart: unless-stopped

  qq-gateway:
    build: ../qq-gateway
    container_name: chat-qq-gateway
    profiles: ["qq"]
    environment:
      - QQ_APP_ID=${QQ_APP_ID:-}
      - QQ_CLIENT_SECRET=${QQ_CLIENT_SECRET:-}
      - QQ_API_BASE_URL=${QQ_API_BASE_URL:-https://api.bot.qq.com}
      - QQ_BOT_ID=${QQ_BOT_ID:-}
      - QQ_DEFAULT_AGENT_ID=${QQ_DEFAULT_AGENT_ID:-}
      - QQ_DEFAULT_OWNER_USER_ID=${QQ_DEFAULT_OWNER_USER_ID:-}
      - QQ_GATEWAY_MASTER_KEY=${QQ_GATEWAY_MASTER_KEY:-}
      - AGENT_SERVICE_SECRET=${AGENT_SERVICE_SECRET:?set AGENT_SERVICE_SECRET in your environment}
      - QQ_AGENT_INTERNAL_URL=http://agent-api:9011
      - QQ_GATEWAY_DATABASE_PATH=/data/qq-gateway.db
      - QQ_MAX_EVENT_TASKS=${QQ_MAX_EVENT_TASKS:-32}
      - QQ_AGENT_RUN_TIMEOUT_SECONDS=${QQ_AGENT_RUN_TIMEOUT_SECONDS:-240}
      - QQ_PASSIVE_REPLY_WINDOW_SECONDS=${QQ_PASSIVE_REPLY_WINDOW_SECONDS:-290}
      - QQ_EVENT_RETRY_AFTER_SECONDS=${QQ_EVENT_RETRY_AFTER_SECONDS:-10}
      - QQ_EVENT_RETRY_INTERVAL_SECONDS=${QQ_EVENT_RETRY_INTERVAL_SECONDS:-5}
    volumes:
      - qq-gateway-data:/data
    depends_on:
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9013/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: chat-agent-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: chat-agent-postgres
    environment:
      - POSTGRES_DB=agent
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gateway:
    image: caddy:2.8-alpine
    container_name: chat-gateway
    ports:
      - "9010:9010"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - chat-server
      - agent-api
    restart: unless-stopped

volumes:
  chat-data:
  redis-data:
  postgres-data:
  qq-gateway-data:
